name: Platform Foundation CI

on:
  push:
    branches: ["foundation/platform", "main"]
  pull_request:
    branches: ["foundation/platform", "main"]

jobs:
  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run unit & redirect tests
        run: npm test

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SITE_URL: "https://www.aiaengineering.com"
          NEXT_PUBLIC_SITE_ENV: "production"

